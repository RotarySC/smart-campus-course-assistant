<div class="bph" id="bph" aria-hidden="true">—</div>

<script>
/* 渐进增强：断点指示器。无 JS 时页面内容与布局完全不受影响。 */
(function () {
  var el = document.getElementById('bph');
  if (!el) return;
  function label(w) {
    if (w >= 1440) return 'XL ≥1440';
    if (w >= 1200) return 'LG ≥1200';
    if (w >= 1024) return 'MD ≥1024';
    if (w >= 768) return 'SM ≥768';
    if (w >= 480) return 'XS ≥480';
    return 'base <480';
  }
  function upd() { el.textContent = label(window.innerWidth) + ' · ' + window.innerWidth + 'px'; }
  upd();
  window.addEventListener('resize', upd);
  /* 当前视图高亮：把点击到的视图同步到导航的 aria-current */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#v-"]');
    if (!a) return;
    var id = a.getAttribute('href');
    document.querySelectorAll('.appbar__nav .navlink, .tabbar__item').forEach(function (n) {
      var same = n.getAttribute('href') === id;
      if (same) { n.setAttribute('aria-current', 'page'); } else { n.removeAttribute('aria-current'); }
    });
  });
})();
</script>
